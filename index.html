<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
          }
          </script>
            <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Змейка v1.4</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* Главное меню */
        #mainMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .menu-title {
            font-size: 42px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
            text-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        .menu-version {
            font-size: 14px;
            color: #666;
            margin-bottom: 40px;
        }

        .menu-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.1s;
            margin-bottom: 20px;
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .menu-record {
            font-size: 18px;
            color: #FFD700;
            font-weight: 600;
        }

        /* Игровой интерфейс */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90vw;
            max-width: 400px;
            margin-bottom: 15px;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
        }

        #pauseBtn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 8px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }

        .canvas-container {
            position: relative;
            max-width: 90vw;
            max-height: 70vh;
        }

        canvas {
            background-color: #1e1e1e;
            border: 3px solid #333;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: block;
        }

        #pauseOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            color: #FFD700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        #pauseOverlay.active {
            opacity: 1;
        }

        #bestScore {
            font-size: 14px;
            color: #FFD700;
            margin-top: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="mainMenu">
        <div class="menu-title">ЗМЕЙКА</div>
        <div class="menu-version">v1.4 "Native Feel"</div>
        <button class="menu-btn" onclick="startGameFromMenu()">ИГРАТЬ</button>
        <div id="menuRecord" class="menu-record">🏆 Рекорд: 0</div>
    </div>

    <div class="header-container">
        <div id="score">Счёт: 0</div>
        <button id="pauseBtn" onclick="togglePause()">Пауза</button>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="pauseOverlay">ПАУЗА<div style="font-size: 14px; color: #aaa; margin-top: 10px;">Свайпни, чтобы продолжить</div></div>
    </div>

    <div id="bestScore">🏆 Рекорд: 0</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const bestScoreElement = document.getElementById("bestScore");
        const menuRecordElement = document.getElementById("menuRecord");
        const pauseBtn = document.getElementById("pauseBtn");
        const pauseOverlay = document.getElementById("pauseOverlay");
        const mainMenu = document.getElementById("mainMenu");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
        let food = {x: 5, y: 5};
        let dx = 1;
        let dy = 0;
        let score = 0;
        
        let bestScore = localStorage.getItem("snake_highscore") || 0;
        
        let lastMoveTime = 0;
        let snakeMoveDelay = 220; 

        let isPaused = true; 
        let isInMenu = true; // Игра в режиме меню

        let animationTimer = 0;
        let eatPulseEffect = 0; 

        let touchStartX = 0;
        let touchStartY = 0;

        function main(currentTime) {
            window.requestAnimationFrame(main);

            animationTimer += 0.2; 
            if (eatPulseEffect > 0) eatPulseEffect -= 0.05; 

            if (isPaused || isInMenu) return;

            if (currentTime - lastMoveTime < snakeMoveDelay) return;
            lastMoveTime = currentTime;

            if (hasGameEnded()) {
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem("snake_highscore", bestScore);
                    updateBestScoreDOM();
                    alert(`Новый РЕКОРД! 🎉 Твой счёт: ${score}`);
                } else {
                    alert(`Игра окончена! Твой счёт: ${score}`);
                }
                backToMenu();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        // Обновление рекордов в меню и игре при старте
        updateBestScoreDOM();

        function startGameFromMenu() {
            isInMenu = false;
            mainMenu.style.opacity = "0";
            setTimeout(() => {
                mainMenu.style.display = "none";
                togglePause(); // Снимаем с паузы и начинаем
            }, 300);
        }

        function backToMenu() {
            isInMenu = true;
            isPaused = true;
            updateBestScoreDOM();
            mainMenu.style.display = "flex";
            setTimeout(() => { mainMenu.style.opacity = "1"; }, 10);
            resetGame();
        }

        function togglePause() {
            if (isInMenu) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.innerText = "Старт";
                pauseOverlay.classList.add("active");
            } else {
                pauseBtn.innerText = "Пауза";
                pauseOverlay.classList.remove("active");
            }
        }

        function updateBestScoreDOM() {
            bestScoreElement.innerText = "🏆 Рекорд: " + bestScore;
            menuRecordElement.innerText = "🏆 Рекорд: " + bestScore;
        }

        function clearCanvas() {
            ctx.fillStyle = "#1e1e1e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "#252525";
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.beginPath();
                const x = part.x * gridSize + gridSize / 2;
                const y = part.y * gridSize + gridSize / 2;
                
                let radiusModifier = 0;
                if (index > 0) {
                    radiusModifier = Math.sin(animationTimer + index) * 1.0;
                }
                
                let radius = (gridSize / 2 - 1) + radiusModifier;
                if (radius < 5) radius = 5; 

                if (index === 0) {
                    ctx.fillStyle = "#4CAF50"; 
                    ctx.arc(x, y, gridSize / 2 - 1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.closePath();

                    ctx.fillStyle = "#FFF"; 
                    let eyeX1, eyeY1, eyeX2, eyeY2;

                    if (dx === 1) { 
                        eyeX1 = x + 4; eyeY1 = y - 4; eyeX2 = x + 4; eyeY2 = y + 4;
                    } else if (dx === -1) { 
                        eyeX1 = x - 4; eyeY1 = y - 4; eyeX2 = x - 4; eyeY2 = y + 4;
                    } else if (dy === 1) { 
                        eyeX1 = x - 4; eyeY1 = y + 4; eyeX2 = x + 4; eyeY2 = y + 4;
                    } else if (dy === -1) { 
                        eyeX1 = x - 4; eyeY1 = y - 4; eyeX2 = x + 4; eyeY2 = y - 4;
                    }

                    ctx.beginPath(); ctx.arc(eyeX1, eyeY1, 2.5, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(eyeX2, eyeY2, 2.5, 0, Math.PI * 2); ctx.fill();
                    
                    ctx.fillStyle = "#000"; 
                    ctx.beginPath(); ctx.arc(eyeX1, eyeY1, 1, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(eyeX2, eyeY2, 1, 0, Math.PI * 2); ctx.fill();
                    return;
                } else {
                    const baseOpacity = Math.max(0.3, 1 - (index / snake.length));
                    const flashOpacity = eatPulseEffect * 0.6; 
                    const finalOpacity = Math.min(1, baseOpacity + flashOpacity);
                    
                    if (eatPulseEffect > 0) {
                        ctx.fillStyle = `rgba(164, 230, 78, ${finalOpacity})`;
                    } else {
                        ctx.fillStyle = `rgba(76, 175, 80, ${finalOpacity})`;
                    }
                    
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.closePath();
                }
            });
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = "Счёт: " + score;
                eatPulseEffect = 1.0; 
                generateFood();
                
                if (score > bestScore) {
                    bestScore = score;
                    updateBestScoreDOM();
                }
            } else {
                snake.pop();
            }
        }

        function drawFood() {
            const x = food.x * gridSize + gridSize / 2;
            const y = food.y * gridSize + gridSize / 2;
            const radius = gridSize / 2 - 2;

            ctx.beginPath();
            ctx.fillStyle = "#FF5252";
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
            
            ctx.beginPath();
            ctx.fillStyle = "#FFF";
            ctx.arc(x - 2, y - 2, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function hasGameEnded() {
            if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) return true;
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
            food = {x: 5, y: 5};
            dx = 1; dy = 0;
            score = 0;
            scoreElement.innerText = "Счёт: " + score;
        }

        // Свайпы
        document.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, false);

        document.addEventListener('touchend', e => {
            if (isInMenu) return; // Игнорируем свайпы в главном меню
            if (!touchStartX || !touchStartY) return;

            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            let newDx = dx;
            let newDy = dy;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0 && dx === 0) { newDx = 1; newDy = 0; }
                else if (diffX < 0 && dx === 0) { newDx = -1; newDy = 0; }
            } else {
                if (diffY > 0 && dy === 0) { newDx = 0; newDy = 1; }
                else if (diffY < 0 && dy === 0) { newDx = 0; newDy = -1; }
            }

            if (isPaused && (newDx !== dx || newDy !== dy)) {
                togglePause();
            }

            dx = newDx;
            dy = newDy;

            touchStartX = 0; touchStartY = 0;
        }, false);

        // Старт цикла анимации
        window.requestAnimationFrame(main);
    </script>
</body>
          </html>
